# Fly.io config for the Party Hub WebSocket server.
# Deploy: `fly launch --no-deploy` (once) to create the app, then `fly deploy`.
# Set your frontend origin: `fly secrets set CLIENT_ORIGIN=https://party-hub.vercel.app`
app = "party-hub-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
