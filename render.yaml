# Render Blueprint for the Party Hub WebSocket server.
# Deploy: push to GitHub, then in Render "New +" → "Blueprint" and point it here.
services:
  - type: web
    name: party-hub-server
    runtime: node
    plan: free
    # Install pnpm directly via npm rather than corepack: the corepack bundled
    # with some Node 22.x point releases (incl. 22.13.0) ships stale npm-registry
    # signing keys and dies with "Cannot find matching keyid" when verifying the
    # pnpm download. npm has no such signature check. Pin the exact version to
    # match package.json#packageManager. Then build the shared types (tsx runs the
    # server's TS directly, so no server build step is needed).
    buildCommand: npm install -g pnpm@11.20.0 && pnpm install --frozen-lockfile && pnpm --filter @party-hub/shared run build
    startCommand: pnpm --filter @party-hub/server run start
    healthCheckPath: /health
    envVars:
      # pnpm 11.20 (pinned via package.json#packageManager) needs Node >= 22.13
      # — it uses the node:sqlite builtin, absent in Node 20.
      - key: NODE_VERSION
        value: "22.13.0"
      # pnpm 11 hard-errors when a dep build script is ignored, and every
      # `pnpm run` re-verifies deps first (re-triggering it). esbuild (via tsx)
      # hits this. These env vars clear both gates for install AND run/start.
      # Safe: esbuild ships its binary via lockfile-pinned platform packages.
      - key: PNPM_CONFIG_STRICT_DEP_BUILDS
        value: "false"
      - key: PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN
        value: "false"
      # Set this in the Render dashboard to your Vercel frontend URL after the
      # first deploy, e.g. https://party-hub.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
